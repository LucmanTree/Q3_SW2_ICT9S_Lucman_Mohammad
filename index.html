<!DOCTYPE html>
<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
		<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<style type="text/css">
			body{
				background-color: indianred;
			}


		</style>

</head>
<body>
	<form>
	<div class="container" style="background-color: blueviolet;"><h2>Solve Arithmetic Equations</h2>
	<label>Value of X:</label>
	<input type="text" id="X"  class="form-control">
	<br><label>Value of Y</label>
	<input type="text" id="Y"  class="form-control">
	<br><button type="Submit" class="btn btn-danger" onclick="addition()">Sum</button>
	<button type="Submit" class="btn btn-warning" onclick="subtraction()">Difference</button>
	<button type="Submit" class="btn btn-success" onclick="multiplication()">Product</button>
	<button type="Submit" class="btn btn-dark" onclick="division()">Quotient</button>
</div>
</form>
	<script>
			
				function addition(){
			var X = document.getElementById("X").value;
			var Y = document.getElementById("Y").value;
			var sum = Number(X) + Number(Y);
			window.alert("The sum is" + sum);
	}

		function subtraction(){
			var X = document.getElementById("X").value;
			var Y = document.getElementById("Y").value;
			var sum = Number(X) - Number(Y);
			window.alert("The result is" + sum);
	}	
		function multiplication(){
			var X = document.getElementById("X").value;
			var Y = document.getElementById("Y").value;
			var sum= Number(X) * Number(Y);
			window.alert("The result is" + sum);

	}	
		function division(){
			var X = document.getElementById("X").value;
			var Y = document.getElementById("Y").value;
			var sum = Number(X) / Number(Y);
			window.alert("The result is" + sum);
	}	

	</script>

</body>
</html>
